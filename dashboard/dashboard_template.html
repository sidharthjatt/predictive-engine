<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest Runs Dashboard</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #5f6368; --line: #d9d9d6;
  --accent: #1f5fbf; --dim: #a8a8a4; --good: #1b7a3d; --bad: #b3261e; --chip: #eef1f6;
  --s1: #1f5fbf; --s2: #c2571a; --s3: #6b6b6b; --s4: #2a8a63; --s5: #8a3fb5; --s6: #b8860b;
  --shade: 31, 95, 191; --tip: #ffffff; --tipink: #1d1d1f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --panel: #1d1f22; --ink: #e8e8e6; --muted: #a2a6ab; --line: #34373b;
    --accent: #7fb0ff; --dim: #5d6166; --good: #6fcf8e; --bad: #ff8a80; --chip: #262a30;
    --s1: #7fb0ff; --s2: #ffa165; --s3: #b5b5b5; --s4: #6fd3a5; --s5: #cf9bf0; --s6: #e8c15a;
    --shade: 127, 176, 255; --tip: #2a2d31; --tipink: #e8e8e6;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --panel: #1d1f22; --ink: #e8e8e6; --muted: #a2a6ab; --line: #34373b;
  --accent: #7fb0ff; --dim: #5d6166; --good: #6fcf8e; --bad: #ff8a80; --chip: #262a30;
  --s1: #7fb0ff; --s2: #ffa165; --s3: #b5b5b5; --s4: #6fd3a5; --s5: #cf9bf0; --s6: #e8c15a;
  --shade: 127, 176, 255; --tip: #2a2d31; --tipink: #e8e8e6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button, .btn, .chip { font: inherit; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
nav button[aria-current="page"], .chip[aria-pressed="true"], .btn.on {
  background: var(--accent); color: var(--panel); border-color: var(--accent); }
.chip.dim { color: var(--dim); border-style: dashed; }
.chip.dim[aria-pressed="true"] { background: var(--dim); color: var(--panel); }
button:focus-visible, select:focus-visible, input:focus-visible, svg:focus-visible, tr:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
main { padding: 16px; max-width: 1280px; margin: 0 auto; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px; margin: 0 0 14px; min-width: 0; }
section.panel h2 { font-size: 15px; margin: 0 0 10px; overflow-wrap: anywhere; }
section.panel li, section.panel p { overflow-wrap: anywhere; }
td.wrap { white-space: normal; overflow-wrap: anywhere; }
.axes { display: grid; gap: 8px; }
.axis { display: grid; grid-template-columns: 220px 1fr; gap: 8px; align-items: start; }
.axis .lab { color: var(--muted); font-size: 13px; padding-top: 5px; }
.axis .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 20px; font-weight: 600; }
.tile .s { color: var(--muted); font-size: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row2 > * { min-width: 0; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
th { color: var(--muted); font-weight: 600; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
.muted { color: var(--muted); }
.pass { color: var(--good); font-weight: 600; }
.fail { color: var(--bad); font-weight: 600; }
.cmd { display: flex; gap: 8px; align-items: flex-start; }
.cmd code { flex: 1; display: block; padding: 8px; background: var(--chip); border-radius: 6px;
  font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
select, input[type="text"] { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
svg.chart { display: block; width: 100%; height: auto; }
svg.chart text { fill: var(--muted); font-size: 11px; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .zero { stroke: var(--muted); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 4px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--tip); color: var(--tipink);
  font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 320px; display: none;
  border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#tip b { font-weight: 600; }
.problems { border: 1px solid var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; background: var(--panel); }
.problems h2 { color: var(--bad); }
.adhoc { border: 2px solid var(--bad); }
.adhoc h2 .tag { color: var(--bad); }
.badge-bad { display: inline-block; color: #fff; background: var(--bad); border-radius: 4px; padding: 1px 7px; font-size: 0.8em; font-weight: 700; vertical-align: middle; }
.capwarn { border: 2px solid var(--bad); }
pre.ki { white-space: pre-wrap; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; margin: 4px 0 0; }
details { border-bottom: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; }
.cell { min-width: 70px; }
.win { color: var(--muted); font-weight: normal; font-size: 13px; }
.diffwin { display: inline-block; font-size: 11px; font-weight: 600; color: var(--bad); border: 1px solid var(--bad);
  border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
details.settings > summary { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
details.settings:not([open]) > summary { margin-bottom: 0; }
details.settings .sum { color: var(--muted); font-weight: normal; font-size: 13px; }
.spread { color: var(--muted); font-style: italic; padding-top: 5px; }
.lab2 { margin: 10px 0 4px; font-weight: 600; }
.legend svg { vertical-align: middle; margin-right: 5px; }
.sr { position: absolute; left: -9999px; }
@media (max-width: 760px) {
  .axis { grid-template-columns: 1fr; }
  .row2 { grid-template-columns: 1fr; }
  .tools { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Backtest runs</h1>
  <nav id="nav" aria-label="Views"></nav>
  <div class="tools">
    <button class="btn" id="openFile" type="button">Open another file</button>
    <input type="file" id="fileInput" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
    <button class="btn" id="theme" type="button" aria-label="Colour theme">Theme: auto</button>
  </div>
</header>
<main id="main"></main>
<div id="tip" role="status" aria-live="polite"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Format check: the same rules as build_dashboard.py validate().
// ---------------------------------------------------------------------------
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TOP = ["schema","generated_at","repo","data_end","command_template","axes","runs","ladder","known_issues","export_checks"];
const RUN_FIELDS = ["id","path","axes","command","start_date","end_date","years","start_equity","end_equity","cagr","max_dd","max_dd_peak","max_dd_trough","basket","index","trades","rebalances","costs","charges_breakdown","yearly","equity","nt_verify","rounded_to"];
const LADDER_FIELDS = ["universe","arm","survivorship","tax","profile","cadence","capital","impact","cap","cagr","basket_cagr","max_dd","impact_cost","slippage","capped_fills","tax_paid"];
const EQ_FIELDS = ["dates","strategy","basket","index","drawdown","basket_drawdown"];
const isNum = x => typeof x === "number" && isFinite(x);
const numOrNull = x => x === null || isNum(x);
const dateOrNull = x => x === null || (typeof x === "string" && DATE_RE.test(x));
const isObj = x => x !== null && typeof x === "object" && !Array.isArray(x);

function validate(d) {
  const p = [];
  if (!isObj(d)) return ["The file is not a JSON object."];
  for (const k of TOP) if (!(k in d)) p.push(`Top-level field "${k}" is missing.`);
  if (p.length) return p;
  if (d.schema !== "pe-dashboard/1") p.push(`schema is ${JSON.stringify(d.schema)}, expected "pe-dashboard/1".`);
  const r = d.repo;
  if (!(isObj(r) && typeof r.head === "string" && typeof r.branch === "string" && typeof r.clean === "boolean"))
    p.push("repo must hold head (string), branch (string) and clean (true or false).");
  if (!dateOrNull(d.data_end)) p.push("data_end is not a YYYY-MM-DD date.");
  if ("window" in d && !(isObj(d.window) && dateOrNull(d.window.start) && dateOrNull(d.window.end) && typeof d.window.reason === "string"))
    p.push("window, when present, must hold start, end (dates) and reason (text).");
  if (!(typeof d.command_template === "string" && d.command_template.includes("{args}")))
    p.push("command_template must be a string containing {args}.");
  const names = [];
  if (!Array.isArray(d.axes) || !d.axes.length) p.push("axes must be a non-empty list.");
  else d.axes.forEach((a, i) => {
    const w = `axes[${i}]`;
    if (!isObj(a)) { p.push(`${w} is not an object.`); return; }
    for (const k of ["name","label","default","values","open_number","cli"]) if (!(k in a)) p.push(`${w} has no "${k}".`);
    if (!["name","values","open_number","cli"].every(k => k in a)) return;
    names.push(a.name);
    if (!(Array.isArray(a.values) && a.values.every(v => typeof v === "string"))) p.push(`${w} (${a.name}): values must be a list of strings.`);
    if (typeof a.default !== "string") p.push(`${w} (${a.name}): default must be a string.`);
    if (a.open_number === true) {
      if (!(typeof a.cli === "string" && a.cli.includes("{value}"))) p.push(`${w} (${a.name}): an open number axis needs cli as a string with {value}.`);
    } else if (a.open_number === false) {
      if (!(isObj(a.cli) && a.values.every(v => typeof a.cli[v] === "string"))) p.push(`${w} (${a.name}): cli must map every value to a flag string.`);
    } else p.push(`${w} (${a.name}): open_number must be true or false.`);
  });
  // ad_hoc is optional: runs from folders not in dashboard/PUBLISHED_RUNS.txt, checked by
  // the same rules as runs. An id is unique across both.
  const ids = new Set();
  for (const field of ["runs", "ad_hoc"]) {
    if (field === "ad_hoc" && !(field in d)) continue;
    if (!Array.isArray(d[field])) { p.push(`${field} must be a list.`); continue; }
    for (let i = 0; i < d[field].length; i++) {
      const run = d[field][i];
      let w = `${field}[${i}]`;
      if (!isObj(run)) { p.push(`${w} is not an object.`); continue; }
      const miss = RUN_FIELDS.filter(k => !(k in run));
      if (miss.length) { p.push(`${w} is missing ${miss.join(", ")}.`); continue; }
      w = `run ${run.id}`;
      if (ids.has(run.id)) p.push(`${w}: id appears twice.`);
      ids.add(run.id);
      if (!isObj(run.axes) || names.some(n => typeof run.axes[n] !== "string"))
        p.push(`${w}: axes must give every axis (${names.join(", ")}) a string value.`);
      for (const k of ["start_date","end_date","max_dd_peak","max_dd_trough"]) if (!dateOrNull(run[k])) p.push(`${w}: ${k} is not a YYYY-MM-DD date or null.`);
      for (const k of ["years","start_equity","end_equity","cagr","max_dd","trades","rebalances"]) if (!numOrNull(run[k])) p.push(`${w}: ${k} is not a number or null.`);
      if (typeof run.command !== "string") p.push(`${w}: command is not a string.`);
      for (const b of ["basket","index"]) {
        const v = run[b];
        if (v === null && b === "index") continue;
        if (!(isObj(v) && typeof v.name === "string" && ["start_equity","cagr","max_dd","end_equity"].every(k => numOrNull(v[k]))))
          p.push(`${w}: ${b} must hold name, start_equity, cagr, max_dd and end_equity.`);
      }
      const c = run.costs;
      if (!(isObj(c) && ["slippage","charges","impact","tax"].every(k => k in c && numOrNull(c[k])))) p.push(`${w}: costs must hold slippage, charges, impact and tax.`);
      const cb = run.charges_breakdown;
      if (cb !== null && !(isObj(cb) && Object.values(cb).every(isNum))) p.push(`${w}: charges_breakdown must map names to rupees.`);
      if (!Array.isArray(run.yearly)) p.push(`${w}: yearly is not a list.`);
      else if (!run.yearly.every(y => isObj(y) && isNum(y.year) && typeof y.full_year === "boolean" && ["strategy","basket","index","tax_paid"].every(k => numOrNull(y[k]))))
        p.push(`${w}: a yearly entry is malformed.`);
      const e = run.equity;
      if (!(isObj(e) && EQ_FIELDS.every(k => k in e))) p.push(`${w}: equity must hold ${EQ_FIELDS.join(", ")}.`);
      else {
        const n = Array.isArray(e.dates) ? e.dates.length : -1;
        if (n < 2 || !e.dates.every(x => typeof x === "string" && DATE_RE.test(x))) p.push(`${w}: equity.dates must be at least two YYYY-MM-DD dates.`);
        for (const k of EQ_FIELDS.slice(1)) {
          const v = e[k];
          if (v === null && k === "index") continue;
          if (!(Array.isArray(v) && v.length === n && v.every(isNum))) p.push(`${w}: equity.${k} must be ${n} numbers.`);
        }
      }
      if (!(isObj(run.rounded_to) && Object.values(run.rounded_to).every(v => Number.isInteger(v))))
        p.push(`${w}: rounded_to must map figure names to whole numbers of decimals.`);
      const cp = run.capacity;
      if (cp !== undefined && cp !== null && !(isObj(cp) && ["median_pct_adv","p95_pct_adv","max_pct_adv","unfilled_cap_pct","not_measurable_pct"].every(k => numOrNull(cp[k])) && (cp.warning === null || cp.warning === undefined || typeof cp.warning === "string")))
        p.push(`${w}: capacity must be null or hold the capacity figures and a warning.`);
      if (!["pass","fail","not covered"].includes(run.nt_verify)) p.push(`${w}: nt_verify must be pass, fail or not covered.`);
      if (p.length > 200) { p.push("More than 200 problems; stopped listing."); return p; }
    }
  }
  if (!Array.isArray(d.ladder)) p.push("ladder must be a list.");
  else for (let i = 0; i < d.ladder.length; i++) {
    const miss = LADDER_FIELDS.filter(k => !isObj(d.ladder[i]) || !(k in d.ladder[i]));
    if (miss.length) { p.push(`ladder[${i}] is missing ${miss.join(", ")}.`); break; }
  }
  if (!(Array.isArray(d.known_issues) && d.known_issues.every(k => isObj(k) && typeof k.title === "string" && typeof k.text === "string")))
    p.push("known_issues must be a list of {title, text}.");
  if (!(Array.isArray(d.export_checks) && d.export_checks.every(x => typeof x === "string")))
    p.push("export_checks must be a list of strings.");
  return p;
}

// ---------------------------------------------------------------------------
// Formatting.
// ---------------------------------------------------------------------------
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 2) => x === null || x === undefined ? "–" : `${x.toFixed(d)}%`;
const spct = (x, d = 2) => x === null || x === undefined ? "–" : `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(d)}`;
function groupIN(intStr) {
  if (intStr.length <= 3) return intStr;
  const last3 = intStr.slice(-3);
  let rest = intStr.slice(0, -3);
  const parts = [];
  while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
  if (rest) parts.unshift(rest);
  return parts.join(",") + "," + last3;
}
function inrFull(x, dec = 0) {
  if (x === null || x === undefined) return "–";
  const neg = x < 0, a = Math.abs(x).toFixed(dec);
  const [i, f] = a.split(".");
  return `${neg ? "−" : ""}Rs ${groupIN(i)}${f ? "." + f : ""}`;
}
function inr(x) {
  if (x === null || x === undefined) return "–";
  const a = Math.abs(x), s = x < 0 ? "−" : "";
  if (a >= 1e7) return `${s}Rs ${(a / 1e7).toFixed(2)} crore`;
  if (a >= 1e5) return `${s}Rs ${(a / 1e5).toFixed(2)} lakh`;
  return `${s}Rs ${groupIN(Math.round(a).toString())}`;
}
function axisValueText(name, v) {
  if (name === "capital" && /^\d+$/.test(v)) return inr(Number(v));
  return v;
}

// ---------------------------------------------------------------------------
// Data and state.
// ---------------------------------------------------------------------------
let DATA, AXES, AXN, RUNS, BYKEY, BYID, ADHOC, ADHOC_BYID;
const keyOf = ax => AXN.map(n => ax[n]).join("|");
function load(d) {
  DATA = d; AXES = d.axes; AXN = AXES.map(a => a.name); RUNS = d.runs;
  BYKEY = new Map(); BYID = new Map();
  for (const r of RUNS) { BYKEY.set(keyOf(r.axes), r); BYID.set(r.id, r); }
  // Ad hoc runs are kept apart: they are never in BYKEY, so no published cell, grid,
  // comparison or ladder figure can come from one.
  ADHOC = d.ad_hoc || []; ADHOC_BYID = new Map(ADHOC.map(r => [r.id, r]));
}
const VIEWS = [["run","Run"],["grid","Grid"],["compare","Compare"],["ladder","Capital ladder"],["methods","Return methods"],["all","All runs"],["adhoc","Ad hoc runs"],["notes","Notes"]];
const state = { view: "run", sel: {}, scale: "log", cmp: [], cmode: "index", grow: "", gcol: "", gmetric: "cagr",
                lcell: "", lmetric: "cagr_minus_basket", lcap: "both", sort: "", sdir: 1, filter: "", setOpen: false, adhoc: "" };

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("view") && VIEWS.some(v => v[0] === h.get("view"))) state.view = h.get("view");
  for (const n of AXN) if (h.get("a." + n) !== null) state.sel[n] = h.get("a." + n);
  for (const k of ["scale","cmode","grow","gcol","gmetric","lcell","lmetric","lcap","sort","filter"]) if (h.get(k) !== null) state[k] = h.get(k);
  state.adhoc = h.get("adhoc") || "";
  if (h.get("sdir")) state.sdir = Number(h.get("sdir")) === -1 ? -1 : 1;
  if (h.get("cmp") !== null) state.cmp = h.get("cmp").split("~").filter(id => BYID.has(id)).slice(0, 6);
}
function writeHash() {
  const h = new URLSearchParams();
  h.set("view", state.view);
  for (const n of AXN) h.set("a." + n, state.sel[n]);
  for (const k of ["scale","cmode","grow","gcol","gmetric","lcell","lmetric","lcap","sort","filter","adhoc"]) if (state[k] !== "") h.set(k, state[k]);
  if (state.sdir === -1) h.set("sdir", "-1");
  if (state.cmp.length) h.set("cmp", state.cmp.join("~"));
  const s = "#" + h.toString();
  if (location.hash !== s) history.replaceState(null, "", s);
}
function initSelection() {
  const first = RUNS[0];
  for (const a of AXES) {
    const v = state.sel[a.name];
    if (v === undefined || !a.values.includes(v)) state.sel[a.name] = first ? first.axes[a.name] : a.values[0];
  }
  const ok = n => AXN.includes(n);
  if (!ok(state.grow)) state.grow = AXN.includes("universe") ? "universe" : AXN[0];
  if (!ok(state.gcol) || state.gcol === state.grow) state.gcol = AXN.find(n => n !== state.grow && n === "arm") || AXN.find(n => n !== state.grow);
}
const current = () => BYKEY.get(keyOf(state.sel)) || null;
const withAxis = (sel, n, v) => Object.assign({}, sel, {[n]: v});
function openRun(r) { state.adhoc = ""; state.sel = Object.assign({}, r.axes); state.view = "run"; render(); window.scrollTo(0, 0); }
function openAdhoc(r) { state.adhoc = r.id; state.view = "run"; render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------------------
// Charts: inline SVG with a tooltip kept inside the window.
// ---------------------------------------------------------------------------
const TIP = document.getElementById("tip");
function showTip(html, cx, cy) {
  TIP.innerHTML = html; TIP.style.display = "block";
  const w = TIP.offsetWidth, h = TIP.offsetHeight, vw = document.documentElement.clientWidth, vh = window.innerHeight;
  let x = cx + 14, y = cy + 14;
  if (x + w > vw - 4) x = Math.max(4, cx - w - 14);
  if (y + h > vh - 4) y = Math.max(4, cy - h - 14);
  TIP.style.left = x + "px"; TIP.style.top = y + "px";
}
function hideTip() { TIP.style.display = "none"; }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES_VARS = ["--s1","--s2","--s3","--s4","--s5","--s6"];
function niceTicks(lo, hi, n) {
  if (!(hi > lo)) { hi = lo + 1; }
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];

// Checks a to d for one line: strategy, basket or index. null means not run.
function lineChecks(r, line) {
  const blk = line === "strategy" ? r : r[line], ser = r.equity[line];
  if (!blk || !ser) return null;
  const ddKey = {strategy: "drawdown", basket: "basket_drawdown", index: null}[line];
  const c = (Math.pow(blk.end_equity / blk.start_equity, 1 / r.years) - 1) * 100;
  const prod = r.yearly.reduce((p, y) => p * (1 + y[line] / 100), 1);
  return {a: Math.abs(c - blk.cagr) <= 0.01,
          b: ddKey ? Math.abs(Math.min(...r.equity[ddKey]) - blk.max_dd) <= 0.01 : null,
          c: Math.abs(prod / (blk.end_equity / blk.start_equity) - 1) <= 0.001,
          d: Math.abs(ser[ser.length - 1] - blk.end_equity) <= 1};

    if (a.open_number) { if (forced || !(a.no_flag || [a.default]).includes(v)) parts.push(a.cli.replace("{value}", v)); }

const METRICS = [["cagr", "CAGR", r => r.cagr, pct], ["minus_basket", "CAGR minus basket", minusBasket, spct], ["minus_index", "CAGR minus index", minusIndex, spct],

    const top = [...cnt.entries()].sort((a, b) => b[1] - a[1])[0]; wref = top ? cells.flat().find(r => r && winOf(r) === top[0]) : null; }
  const lo = Math.min(...vals), hi = Math.max(...vals), rgb = css("--shade");

  h += `<div class="scroll"><table><thead><tr><th class="l">${esc(ra.label)} \\ ${esc(ca.label)}</th>${ca.values.map(v => `<th>${esc(axisValueText(ca.name, v))}</th>`).join("")}</tr></thead><tbody>`;
  ra.values.forEach((rv, i) => {
    h += `<tr><th class="l">${esc(axisValueText(ra.name, rv))}</th>`;
    ca.values.forEach((cv, j) => {

      if (!r || v === null) { h += `<td class="cell muted">${r ? "–" : ""}</td>`; return; }
      let t = hi > lo ? (v - lo) / (hi - lo) : 0.5; if (better < 0) t = 1 - t;

      h += `<td class="cell"><button type="button" class="btn" style="background:rgba(${rgb},${a});width:100%" data-open="${esc(r.id)}" title="${esc(settingsText(r))}">${met[3](v)}${diffWin(r, wref) ? '<br><span class="diffwin">different window</span>' : ""}</button></td>`;
    });
    h += "</tr>";
  });
  h += "</tbody></table></div></section>";
  MAIN.innerHTML = h;

const LMETRICS = [["cagr_minus_basket", "CAGR minus basket", spct], ["cagr", "CAGR", pct], ["max_dd", "Max drawdown", pct], ["impact_cost", "Impact cost", inr]];
// Rows where CAGR rises as k rises, within one cell, capital and cap, and the
// largest such rise. Impact only adds cost, so a rise comes from the trade path.
function ladderNoise(L) {
  const groups = new Map();
  for (const x of L) { const k = `${x.universe}|${x.arm}|${x.capital}|${x.cap}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); }
  let n = 0, max = 0;
  for (const g of groups.values()) {
    g.sort((p, q) => p.impact - q.impact);
    for (let i = 1; i < g.length; i++) if (g[i].cagr > g[i - 1].cagr) { n++; max = Math.max(max, g[i].cagr - g[i - 1].cagr); }
  }
  return {n, total: L.length, max};
}
function viewLadder() {
  const L = DATA.ladder;
  const cellsList = [...new Set(L.map(x => `${x.universe} ${x.arm}`))];
  let h = `<section class="panel"><h2>Capital ladder</h2>`;
  if (!cellsList.length) { MAIN.innerHTML = h + '<p class="muted">No ladder rows in this file.</p></section>'; return; }
  if (!cellsList.includes(state.lcell)) state.lcell = cellsList[0];
  const met = LMETRICS.find(m => m[0] === state.lmetric) || LMETRICS[0];
  const all = L.filter(x => `${x.universe} ${x.arm}` === state.lcell);
  const capVals = [...new Set(L.map(x => x.cap))].sort((p, q) => q - p);
  const fullCap = capVals[0];
  if (state.lcap !== "both" && !capVals.map(String).includes(state.lcap)) state.lcap = "both";
  const rows = state.lcap === "both" ? all : all.filter(x => String(x.cap) === state.lcap);
  const fixed = all[0];
  const ks = [...new Set(L.map(x => x.impact))].sort((p, q) => p - q);
  // One light-to-dark ramp over k; in dark mode the ramp runs dim to bright.
  const shade = k => { const t = ks.length > 1 ? ks.indexOf(k) / (ks.length - 1) : 1;
    const lo = isDark() ? 38 : 80, hi = isDark() ? 88 : 22; return `hsl(215, 70%, ${(lo + (hi - lo) * t).toFixed(0)}%)`; };
  const dashOf = c => c === fullCap ? "" : "6,4";
  h += `<div class="ctrl"><label>Cell <select id="lCell">${cellsList.map(c => `<option ${c === state.lcell ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
    <label>Metric <select id="lMet">${LMETRICS.map(m => `<option value="${m[0]}" ${m[0] === met[0] ? "selected" : ""}>${m[1]}</option>`).join("")}</select></label>
    <span class="muted">Cap</span>${["both", ...capVals.map(String)].map(c => `<button type="button" class="btn${state.lcap === c ? " on" : ""}" aria-pressed="${state.lcap === c}" data-lcap="${c}">${c === "both" ? "Both" : "cap " + c}</button>`).join("")}</div>
    <p class="muted">${esc(fixed.survivorship)}, ${esc(fixed.profile)}, tax ${esc(String(fixed.tax))}, cadence ${esc(String(fixed.cadence))}. Colour runs light to dark as k rises; solid lines are cap ${fullCap}, dashed lines are lower caps. Capital on a log scale.</p>
    <div id="legL"></div><div id="chL"></div>`;
  const nz = ladderNoise(L);
  h += `<p class="muted">Neighbouring k values can differ by up to about ${nz.max.toFixed(1)} pt from trade-path differences alone: ${nz.n} of ${nz.total} rows show CAGR rising as k rises, which extra impact cost cannot cause, so gaps that small are noise.</p>`;
  const lines = [...new Set(rows.map(x => `${x.impact}|${x.cap}`))].sort((p, q) => { const [k1, c1] = p.split("|").map(Number), [k2, c2] = q.split("|").map(Number); return c2 - c1 || k1 - k2; });
  const caps = [...new Set(rows.map(x => x.capital))].sort((p, q) => p - q);
  const lineName = l => { const [k, c] = l.split("|"); return `k ${k}, cap ${c}`; };
  h += `<div class="scroll"><table><thead><tr><th class="l">Capital</th>${lines.map(l => `<th>${esc(lineName(l))}</th>`).join("")}</tr></thead><tbody>`;
  for (const c of caps) h += `<tr><td class="l">${inr(c)}</td>${lines.map(l => { const x = rows.find(y => y.capital === c && `${y.impact}|${y.cap}` === l); return `<td>${x && x[met[0]] !== null && x[met[0]] !== undefined ? met[2](x[met[0]]) : ""}</td>`; }).join("")}</tr>`;
  h += "</tbody></table></div></section>";
  MAIN.innerHTML = h;
  document.getElementById("lCell").addEventListener("change", e => { state.lcell = e.target.value; render(); });
  document.getElementById("lMet").addEventListener("change", e => { state.lmetric = e.target.value; render(); });
  MAIN.querySelectorAll("[data-lcap]").forEach(b => b.addEventListener("click", () => { state.lcap = b.dataset.lcap; render(); }));
  const series = lines.map(l => { const [k, c] = l.split("|").map(Number);
    const pts = rows.filter(y => `${y.impact}|${y.cap}` === l).sort((p, q) => p.capital - q.capital);
    return {name: lineName(l), color: shade(k), dash: dashOf(c), xs: pts.map(p => p.capital), ys: pts.map(p => p[met[0]] === undefined ? null : p[met[0]])}; });
  document.getElementById("legL").innerHTML = legend(series.map(s => [s.name, s.color, s.dash]));
  lineChart(document.getElementById("chL"), {series, xType: "log", yFmt: met[2], xFmt: inr, xTick: inr, markers: true, zero: met[0] !== "impact_cost", height: 320, label: "Capital ladder chart"});
}

function viewMethods() {
  const r = current();
  let h = axisControls();
  if (!r) { MAIN.innerHTML = h + '<section class="panel"><p>This combination has not been run. Pick settings with a run.</p></section>'; bindAxisControls(); return; }

  if (r.index) lines.push(["Index", r.index.cagr, "index", e.index]);
  const full = r.yearly.filter(y => y.full_year);
  const yearsUsed = full.map(y => y.year);
  h += `<section class="panel"><h2>Return methods — ${esc(r.axes.universe)} ${esc(r.axes.arm)}</h2>
    <p class="muted">${esc(r.start_date)} to ${esc(r.end_date)}, ${r.years.toFixed(4)} years (calendar days / 365.25). Full calendar years used for the mean: ${yearsUsed.length ? esc(yearsUsed.join(", ")) : "none"}.</p>
    <div class="scroll"><table><thead><tr><th class="l">Line</th><th>CAGR</th><th>Mean of full calendar years</th><th>Total gain / years, no compounding</th></tr></thead><tbody>`;

    const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const simple = series ? (series[series.length - 1] / series[0] - 1) / r.years * 100 : null;
    h += `<tr><td class="l">${name}</td><td>${pct(cagr)}</td><td>${pct(mean)}</td><td>${pct(simple)}</td></tr>`;
    if (cagr !== null && mean !== null && simple !== null)
      expl.push(`<li><b>${name}.</b> CAGR ${pct(cagr)} is the steady yearly rate that turns the start value into the end value. The mean of full years, ${pct(mean)}, averages the ${vals.length} yearly returns and ignores that losses and gains compound. Total gain divided by years, ${pct(simple)}, spreads the whole gain evenly with no compounding.</li>`);
  }
  h += `</tbody></table></div><ul>${expl.join("")}</ul>`;
  const twin = r.fixed_twin ? BYID.get(r.fixed_twin) : null;
  if (twin) h += fixedBlock(r.axes.fixed === "on" ? r : twin, r.axes.fixed === "on" ? twin : r);
  else h += `<p>${r.axes.fixed === "on" ? "This fixed-capital run has no compounded twin with the same settings in this data." : "A fixed-capital backtest, where profits are taken out and not reinvested, is not in this data for these settings. This run reinvests everything."}</p>`;
  h += `</section>`;
  MAIN.innerHTML = h; bindAxisControls();
}

// The fixed-capital figures of a run (results/fixed_capital.py), next to the
// compounded CAGR of its twin: the same settings with --fixed-capital off.
function fixedBlock(fx, comp) {
  const F = fx.fixed || {};
  const lines = [["Strategy", "strategy", comp.cagr], ["Basket", "basket", comp.basket && comp.basket.cagr]];
  if (F.index) lines.push(["Index", "index", comp.index && comp.index.cagr]);
  const fy = (F.strategy && F.strategy.full_years) || [];
  let h = `<h3>Fixed capital: profits not reinvested</h3>
    <p class="muted">From the run with --fixed-capital (base ${inr(fx.start_equity)}), next to the compounded CAGR of the same settings without it.</p>
    <div class="scroll"><table><thead><tr><th class="l">Line</th><th>Compounded CAGR</th><th>AvgAnnRet%</th><th>MeanFullYear%</th><th>MaxDD_base%</th><th>MaxInvested_base%</th></tr></thead><tbody>`;
  for (const [name, key, cagr] of lines) {
    const x = F[key];
    if (!x) continue;
    h += `<tr><td class="l">${name}</td><td>${pct(cagr)}</td><td>${pct(x.avg_ann_ret)}</td><td>${pct(x.mean_full_year)}</td><td>${pct(x.max_dd_base)}</td><td>${pct(x.max_invested_base)}${x.max_invested_date ? ` <span class="muted">${esc(x.max_invested_date)}</span>` : ""}</td></tr>`;
  }
  h += `</tbody></table></div><ul>
    <li><b>Compounded CAGR</b> is the steady yearly rate of the run that reinvests every profit, with every other setting the same.</li>
    <li><b>AvgAnnRet%</b> is the fixed-capital run's total net profit divided by the base and by the ${fx.years.toFixed(2)} years; nothing compounds.</li>
    <li><b>MeanFullYear%</b> is the average of each full calendar year's rupee profit or loss divided by the base, over ${fy.length ? esc(fy.join(", ")) : "no full year"}.</li>
    <li><b>MaxDD_base%</b> is the largest fall from a running peak, in rupees, divided by the base rather than by the peak.</li>
    <li><b>MaxInvested_base%</b> is the highest held market value divided by the base: for the strategy at a rebalance open after its buys, for the basket and the index at a reset close before the reset. Above 100% means held winners grew past the base, which the strategy does not trim.</li>
  </ul>
  <p class="muted">The basket and the index are reset to the smaller of the base and their equity at the close of each of the strategy's rebalance decision days, one session before the strategy's own reset at the next open. The index is a price index, without dividends. CAGR of the fixed-capital run itself understates it and is not shown here.</p>`;
  const years = [...new Set(Object.keys((F.strategy || {}).years || {}))].sort();
  h += `<div class="scroll"><table><thead><tr><th class="l">Year</th>${lines.filter(l => F[l[1]]).map(l => `<th>${l[0]} Year%</th>`).join("")}</tr></thead><tbody>`;
  for (const y of years) {
    h += `<tr><td class="l">${esc(y)}${fy.includes(Number(y)) ? "" : ' <span class="muted">(part year)</span>'}</td>${lines.filter(l => F[l[1]]).map(l => { const v = F[l[1]].years[y]; return `<td>${v ? pct(v.pct) : "–"}</td>`; }).join("")}</tr>`;
  }
  h += `</tbody></table></div><p class="muted">Year% is that calendar year's rupee profit or loss divided by the base.</p>`;
  return h;
}

// capacity.py's figures for one run, as one line; "not measured" when absent.
function capText(c) {
  if (!c) return "not measured";
  const f = x => x === null || x === undefined ? "n/a" : `${x.toFixed(2)}%`;
  const nm = c.not_measurable_fills === undefined ? "" : ` ${c.not_measurable_fills.toLocaleString("en-IN")} of ${c.buy_fills.toLocaleString("en-IN")} buy fills not measurable (${f(c.not_measurable_pct)}): no NSE row in their 20 sessions.`;
  return `Buy fills against 20-day average traded value, NSE rows only: median ${f(c.median_pct_adv)}, 95th percentile ${f(c.p95_pct_adv)}, largest ${f(c.max_pct_adv)}; cap left ${f(c.unfilled_cap_pct)} of buy value unfilled.${nm}`;
}
const capNm = c => c.not_measurable_pct === undefined ? "" : ` <span class="muted">${c.not_measurable_pct.toFixed(1)}% not measurable</span>`;
const capBadge = r => !r.capacity ? '<span class="muted">not measured</span>' : (r.capacity.warning ? '<span class="badge-bad">WARNING</span>' : "ok") + capNm(r.capacity);
function viewAll() {
  const cols = [...AXES.map(a => ({k: "ax." + a.name, h: a.name, l: 1, v: r => r.axes[a.name], f: r => esc(axisValueText(a.name, r.axes[a.name])), num: a.open_number})),
    {k: "start", h: "Start", l: 1, v: r => r.start_date, f: r => esc(r.start_date)},
    {k: "end", h: "End", l: 1, v: r => r.end_date, f: r => esc(r.end_date)},
    {k: "cagr", h: "CAGR", v: r => r.cagr, f: r => pct(r.cagr), num: 1},
    {k: "basket", h: "Basket", v: r => r.basket && r.basket.cagr, f: r => pct(r.basket && r.basket.cagr), num: 1},
    {k: "mb", h: "CAGR − basket", v: minusBasket, f: r => spct(minusBasket(r)), num: 1},
    {k: "dd", h: "Max DD", v: r => r.max_dd, f: r => pct(r.max_dd), num: 1},
    {k: "end", h: "End equity", v: r => r.end_equity, f: r => inr(r.end_equity), num: 1},
    {k: "tax", h: "Tax", v: r => r.costs.tax, f: r => inr(r.costs.tax), num: 1},
    {k: "trades", h: "Trades", v: r => r.trades, f: r => String(r.trades), num: 1},
    {k: "nt", h: "nt_verify", l: 1, v: r => r.nt_verify, f: r => esc(r.nt_verify)},
    {k: "cap", h: "Capacity", l: 1, v: r => !r.capacity ? "" : r.capacity.warning ? "WARNING" : "ok", f: capBadge}];
  // Every word of the filter must appear in the run's id or one of its settings.
  const words = state.filter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows = RUNS.filter(r => { const t = (r.id + " " + AXES.map(a => `${a.name} ${r.axes[a.name]}`).join(" ") + " nt_verify " + r.nt_verify).toLowerCase();
    return words.every(w => t.includes(w)); });
  const sc = cols.find(c => c.k === state.sort);
  if (sc) rows = rows.slice().sort((a, b) => { let x = sc.v(a), y = sc.v(b);
    if (sc.num) { x = x === null ? -Infinity : Number(x); y = y === null ? -Infinity : Number(y); return (x - y) * state.sdir; }
    return String(x).localeCompare(String(y)) * state.sdir; });
  let h = `<section class="panel"><h2>All runs (${rows.length} of ${RUNS.length})</h2>
    <div class="ctrl"><label>Filter <input type="text" id="flt" value="${esc(state.filter)}" placeholder="e.g. nifty200 tradeable pit"></label></div>
    <div class="scroll"><table><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}" aria-sort="${state.sort === c.k ? (state.sdir === 1 ? "ascending" : "descending") : "none"}"><button type="button" data-sort="${c.k}">${esc(c.h)}${state.sort === c.k ? (state.sdir === 1 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead><tbody>`;
  for (const r of rows) h += `<tr class="click" tabindex="0" data-open="${esc(r.id)}">${cols.map(c => `<td class="${c.l ? "l" : ""}">${c.f(r)}</td>`).join("")}</tr>`;
  h += "</tbody></table></div></section>";
  MAIN.innerHTML = h; bindRowOpen(MAIN);
  MAIN.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
    if (state.sort === b.dataset.sort) state.sdir = -state.sdir; else { state.sort = b.dataset.sort; state.sdir = 1; }
    render(); const again = MAIN.querySelector(`[data-sort="${b.dataset.sort}"]`); if (again) again.focus(); }));
  const f = document.getElementById("flt");
  f.addEventListener("input", () => { state.filter = f.value; const pos = f.selectionStart; render(); const g = document.getElementById("flt"); g.focus(); g.setSelectionRange(pos, pos); });
}

function viewAdhoc() {
  let h = `<section class="panel adhoc"><h2><span class="tag">AD HOC</span> runs (${ADHOC.length})</h2>
    <p class="wrap">Finished runs whose folder is not in dashboard/PUBLISHED_RUNS.txt: a demonstration, a test or a rerun not yet published. None of them is a published figure, replaces a published cell, or feeds check f or the capital ladder.</p>`;
  if (!ADHOC.length) h += '<p class="muted">None.</p>';
  else h += runTable(ADHOC, [{h: "Run folder", l: 1, f: r => esc(r.id)}, {h: "Settings", l: 1, f: r => esc(settingsText(r))},
    {h: "CAGR", f: r => pct(r.cagr)}, {h: "Basket", f: r => pct(r.basket && r.basket.cagr)}, {h: "Max DD", f: r => pct(r.max_dd)},
    {h: "End equity", f: r => inr(r.end_equity)}, {h: "Tax", f: r => inr(r.costs.tax)}], r => `data-adhoc="${esc(r.id)}"`);
  MAIN.innerHTML = h + "</section>";
  MAIN.querySelectorAll("tr[data-adhoc]").forEach(tr => {
    const go = () => openAdhoc(ADHOC_BYID.get(tr.dataset.adhoc));
    tr.addEventListener("click", go);
    tr.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
  });
}

// The bias label of a universe whose results carry a bias that cannot be measured
// (universes/registry.py, Universe.bias_note), shown above its figures.
function biasPanel(r) {
  return `<section class="panel"><h2>Bias: ${esc(r.axes.universe)}</h2><p class="wrap"><b>${esc(r.bias_note)}</b></p></section>`;
}

function viewNotes() {
  const d = DATA;
  let h = `<section class="panel"><h2>Notes</h2><div class="scroll"><table><tbody>
    <tr><td class="l">Repository</td><td class="l wrap">${esc(d.repo.head)} on ${esc(d.repo.branch)}, working tree ${d.repo.clean ? "clean" : "<span class=fail>not clean</span>"} at export</td></tr>
    <tr><td class="l">Price data through</td><td class="l">${esc(d.data_end || "–")}</td></tr>
    <tr><td class="l">Runs end</td><td class="l wrap">${esc([...new Set(RUNS.map(r => r.end_date))].sort().join(", "))}${d.window ? ". " + esc(d.window.reason) : ""}</td></tr>
    <tr><td class="l">Exported</td><td class="l">${esc(d.generated_at)}</td></tr>
    <tr><td class="l">Runs</td><td class="l">${RUNS.length} published, ${ADHOC.length} ad hoc</td></tr>
    <tr><td class="l">Command template</td><td class="l wrap"><code>${esc(d.command_template)}</code></td></tr></tbody></table></div></section>
    ${d.bias_notes && Object.keys(d.bias_notes).length ? `<section class="panel"><h2>Universes with a bias label (${Object.keys(d.bias_notes).length})</h2><div class="scroll"><table><tbody>${Object.entries(d.bias_notes).map(([t, n]) => `<tr><td class="l">${esc(t)}</td><td class="l wrap">${esc(n)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <section class="panel"><h2>Export checks (${d.export_checks.length})</h2><ul>${d.export_checks.map(c => `<li class="${/\bFAIL\b/.test(c) ? "fail" : ""}">${esc(c)}</li>`).join("")}</ul></section>
    <section class="panel"><h2>Known issues (${d.known_issues.length}), as written in KNOWN_ISSUES.md</h2>
    ${d.known_issues.map(k => `<details><summary>${esc(k.title)}</summary><pre class="ki">${esc(k.text)}</pre></details>`).join("")}</section>`;
  MAIN.innerHTML = h;
}

// ---------------------------------------------------------------------------
// Shell.
// ---------------------------------------------------------------------------
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = VIEWS.map(([k, n]) => `<button type="button" data-view="${k}" ${state.view === k ? 'aria-current="page"' : ""}>${n}${k === "compare" && state.cmp.length ? ` (${state.cmp.length})` : ""}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; state.adhoc = ""; render(); }));
}
let problemsHtml = "";
function render() {
  hideTip(); renderNav();
  ({run: viewRun, grid: viewGrid, compare: viewCompare, ladder: viewLadder, methods: viewMethods, all: viewAll, adhoc: viewAdhoc, notes: viewNotes})[state.view]();
  if (problemsHtml) MAIN.insertAdjacentHTML("afterbegin", problemsHtml);
  writeHash();
}
function themeInit() {
  const b = document.getElementById("theme"), order = ["auto", "light", "dark"];
  let t = "auto"; try { t = localStorage.getItem("pe-theme") || "auto"; } catch (e) {}
  const apply = () => { if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; b.textContent = "Theme: " + t; };
  apply();
  b.addEventListener("click", () => { t = order[(order.indexOf(t) + 1) % 3]; try { localStorage.setItem("pe-theme", t); } catch (e) {} apply(); if (DATA) render(); });
}
function fileInit() {
  const inp = document.getElementById("fileInput");
  document.getElementById("openFile").addEventListener("click", () => inp.click());
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d, probs;
      try { d = JSON.parse(rd.result); probs = validate(d); } catch (e) { probs = [`The file is not valid JSON: ${e.message}`]; }
      if (probs.length) {
        problemsHtml = `<div class="problems" role="alert"><h2>${esc(f.name)} was not loaded: ${probs.length} problem${probs.length === 1 ? "" : "s"}</h2><ul>${probs.map(x => `<li>${esc(x)}</li>`).join("")}</ul><p>The page still shows the previous data.</p></div>`;
      } else {
        problemsHtml = ""; load(d); state.cmp = state.cmp.filter(id => BYID.has(id)); initSelection();
      }
      inp.value = ""; render(); window.scrollTo(0, 0);
    };
    rd.readAsText(f);
  });
}
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (DATA && ["run","compare","ladder"].includes(state.view)) render(); }, 200); });
window.addEventListener("hashchange", () => { if (!DATA) return; readHash(); initSelection(); render(); });
(function start() {
  themeInit(); fileInit();
  let d = null, probs;
  try { d = JSON.parse(document.getElementById("data").textContent); probs = d === null ? ["No data is embedded in this page. Use \"Open another file\"."] : validate(d); }
  catch (e) { probs = [`The embedded data is not valid JSON: ${e.message}`]; }
  if (probs.length) {
    MAIN.innerHTML = `<div class="problems" role="alert"><h2>The embedded data failed the format check</h2><ul>${probs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    return;
  }
  load(d); readHash(); initSelection(); render();
})();
</script>
</body>
</html>
